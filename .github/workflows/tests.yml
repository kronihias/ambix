name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS
            continue-on-error: false
          - os: windows-2022
            name: Windows
            continue-on-error: false
          - os: ubuntu-22.04
            name: Linux
            # First-pass Linux CI: don't gate PRs on it while we shake out
            # platform-specific issues. Flip to false once it's reliably green.
            continue-on-error: true
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    continue-on-error: ${{ matrix.continue-on-error }}
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        # Init submodules manually below. actions/checkout shallow-clones
        # submodules at --depth=1, which misses our JUCE pin (8.0.13 is a
        # few commits behind upstream's default-branch tip). Its fallback
        # direct-SHA fetch then fails with a credential prompt because the
        # github.com extraheader doesn't propagate to that second fetch.

      - name: Init submodules
        shell: bash
        run: |
          # Full (non-shallow) clone so any pinned-but-not-tip JUCE commit
          # is always reachable. Retry to absorb transient github.com flakes.
          for i in 1 2 3; do
            git submodule update --init --recursive && exit 0
            echo "submodule update failed (attempt $i/3), retrying in 10s..."
            sleep 10
          done
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # JUCE on Linux needs ALSA/X11/freetype/etc even for plugins that are
      # never opened in a GUI host — juce_gui_basics is pulled in transitively
      # and the link step references these. FFTW3 comes from the distro here
      # rather than vcpkg (faster, and ubuntu ships a recent-enough fftw3f).
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            libfftw3-dev \
            libasound2-dev \
            libjack-jackd2-dev \
            libfreetype6-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            libglu1-mesa-dev \
            mesa-common-dev \
            libcurl4-openssl-dev \
            libwebkit2gtk-4.1-dev \
            xvfb

      # vcpkg manifest mode pulls in FFTW3 on Windows (see vcpkg.json). The
      # GH Actions Windows runner has vcpkg preinstalled at
      # VCPKG_INSTALLATION_ROOT; using its built-in GHA binary cache backend
      # means FFTW3 is rebuilt only when the manifest changes.
      - name: Export GitHub Actions cache env (for vcpkg binary cache)
        if: runner.os == 'Windows'
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Build plugins + testhost and run tests
        env:
          VCPKG_BINARY_SOURCES: ${{ runner.os == 'Windows' && 'clear;x-gha,readwrite' || '' }}
          # tests/test_pluginval.py runs Tracktion's pluginval over every built
          # VST3 (run_tests.py downloads the pinned release into _build/tools).
          # Editor tests stay off: ambix_encoder's editor needs an OpenGL
          # context, which hosted runners don't reliably provide.
          PLUGINVAL_SKIP_GUI: '1'
          PLUGINVAL_STRICTNESS: '10'
          # Fail rather than skip if the validator couldn't be fetched, so a
          # bad download never silently drops this layer of coverage.
          PLUGINVAL_REQUIRED: '1'
        # xvfb on Linux: pedalboard's VST3 loader and some JUCE init paths
        # touch the display server even for "headless" use, so give them a
        # virtual one rather than chasing per-plugin skips.
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a python scripts/run_tests.py' || 'python scripts/run_tests.py' }}

      # The Linux/JACK standalone uses the vendored host in common/standalone.
      # run_tests.py configures with -DBUILD_STANDALONE=OFF, so the standalone is
      # never compiled there - build a couple of targets here as a smoke test of
      # the JACK path. Compile only (no JACK server or display needed);
      # libjack-jackd2-dev is installed above. rotator exercises the linked /
      # ambisonic-count selector, encoder the independent in/out path.
      - name: Build JACK standalone (Linux)
        if: runner.os == 'Linux'
        run: |
          # The universal build (which creates the *_Standalone targets) is gated
          # on BUILD_VST3 OR BUILD_AU per plugin, so VST3 stays ON; --target only
          # builds the Standalone, not the VST3.
          cmake -S . -B _build_standalone -G Ninja \
            -DBUILD_VST=OFF -DBUILD_VST3=ON -DBUILD_AU=OFF \
            -DBUILD_STANDALONE=ON -DBUILD_VISUALIZER=OFF -DBUILD_TESTHOST=OFF \
            -DNUM_OUTPUTS_DECODER=64 -DMAX_AMBI_ORDER=7
          cmake --build _build_standalone --parallel \
            --target ambix_rotator_Standalone ambix_encoder_Standalone

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: pytest-${{ matrix.name }}
          path: |
            _build/CMakeFiles/CMakeOutput.log
            _build/CMakeFiles/CMakeError.log
            _build/pluginval-logs/
          if-no-files-found: ignore
          retention-days: 14
